<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>弗一把</title>
    <!-- Bootstrap 5 CDN，联网即可用，不用下载 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* 加上 td 前缀提高优先级，!important 确保压过 Bootstrap */
    td.cell-green  { background-color: #198754 !important; color: #fff; }
    td.cell-yellow { background-color: #ffc107 !important; color: #000; }
    td.cell-grey   { background-color: #6c757d !important; color: #fff; }
    </style>
</head>
<body class="bg-dark text-light">
    <div class="container py-4" style="max-width: 900px;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
